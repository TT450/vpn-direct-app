services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: vpn-direct-wg-easy
    profiles: ["lab"]
    environment:
      - WG_HOST=${WG_HOST}
      - PASSWORD=${PASSWORD:-}
      - PORT=51821
    volumes:
      - etc_wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
volumes:
  etc_wireguard:
