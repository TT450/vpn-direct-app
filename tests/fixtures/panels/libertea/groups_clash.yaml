proxies:
  - name: Libertea-Primary
    type: vless
    server: 203.0.113.60
    port: 443
    uuid: 11111111-1111-1111-1111-111111111111
    network: ws
    tls: true
    servername: camouflage.example.com
    ws-opts:
      path: /vless
      headers:
        Host: camouflage.example.com
  - name: Libertea-Secondary
    type: vless
    server: 203.0.113.60
    port: 443
    uuid: 22222222-2222-2222-2222-222222222222
    network: ws
    tls: true
    servername: camouflage.example.com
    ws-opts:
      path: /vless-backup
      headers:
        Host: camouflage.example.com
  - name: Libertea-Relay
    type: trojan
    server: 203.0.113.61
    port: 443
    password: password-fixture
    sni: camouflage.example.com

proxy-groups:
  - name: GROUP-A
    type: select
    proxies:
      - Libertea-Primary
      - Libertea-Secondary
  - name: GROUP-B
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - Libertea-Secondary
      - Libertea-Relay
      - Libertea-Primary
  - name: AUTO-FAILOVER
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 60
    proxies:
      - GROUP-A
      - GROUP-B
