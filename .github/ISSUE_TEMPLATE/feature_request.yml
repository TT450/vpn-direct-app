name: Feature request
description: Propose a client or Core capability improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Prefer linking a Protocol Matrix row or production-plan milestone when asking for protocol work.
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Apple UI / UX
        - Subscription / parser
        - VPN Direct Core / Libbox
        - CI / docs
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional
