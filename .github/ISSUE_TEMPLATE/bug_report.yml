name: Bug report
description: Report a defect in VPN Direct (Apple client / Core)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. Do **not** include private keys, subscription tokens, or real server credentials.
  - type: textarea
    id: describe
    attributes:
      label: What happened?
      description: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App / Core version
      placeholder: "1.0.2 / VPNDirectCore 0.1.0"
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - macOS
        - tvOS
        - Other / build scripts only
  - type: textarea
    id: caps
    attributes:
      label: Capability / Core notes (optional)
      description: Redacted CapabilityJSON snippet or Protocol Matrix row if relevant.
