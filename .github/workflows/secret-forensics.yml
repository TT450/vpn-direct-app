name: Secret forensics

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Full Git history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all refs and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan every reachable ref and commit history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_VERSION: latest
          GITLEAKS_COMMAND: git
          GITLEAKS_LOG_OPTS: --all --full-history
