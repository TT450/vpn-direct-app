name: Secret forensics

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Full Git history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all refs and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan every reachable ref and commit history
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            git --redact --exit-code 1 \
            --log-opts="--all --full-history" \
            /repo
